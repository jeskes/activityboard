<!DOCTYPE html>
<html>

<head>
	<meta charset='UTF-8'>
	<meta name='viewport' content='width=device-width, initial-scale=1.0'>
	<title>Dynamic Dashboard</title>
	<style>
		body {
			text-align: center;
			font-family: sans-serif;
			background: #f4f6f9;
			color: #333;
			margin: 0;
			padding: 20px;
		}

		.container {
			max-width: 320px;
			margin: 0 auto;
			background: white;
			padding: 20px;
			border-radius: 10px;
			box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
		}

		#main-image {
			height: auto;
			max-width: 100%;
			border-radius: 1em;
			margin: 1em auto;
		}

		.btn {
			padding: 15px;
			font-size: 16px;
			margin: 10px 0;
			width: 100%;
			border: none;
			border-radius: 1em;
			cursor: pointer;
			font-weight: bold;
			transition: opacity 0.2s;
		}

		.btn:hover {
			opacity: 0.9;
		}

		#status {
			font-weight: bold;
			margin-top: 20px;
			font-size: 18px;
			color: #666;
			padding: 10px;
			border-radius: 5px;
		}
	</style>
	<script>
		var connection = undefined;
		function init() {
			try {
				connection = new WebSocket('ws://' + location.hostname + ':81/');
				connection.onopen = function () {
					document.getElementById('status').innerHTML = "connected. loading configuration...";
				};
				connection.onerror = function (error) {
					document.getElementById('status').innerHTML = "cannot connect to websocket";
					fallback();
				};
				connection.onmessage = function (e) {
					var rawData = e.data;
					if (rawData.startsWith("CONFIG:")) {
						var config = JSON.parse(rawData.substring(7));
						buildPage(config);
						return;
					}
				};
			}
			catch (e) {
				document.getElementById('status').innerHTML = "cannot connect to websocket";
				fallback();
			}
		}

		function buildPage(config) {
			console.log('config'.config);
			if (config.image) {
				var img = document.getElementById('main-image');
				img.src = config.image;
				img.style.display = "block";
			}

			var buttonContainer = document.getElementById('button-container');
			buttonContainer.innerHTML = "";
			config.buttons.forEach(function (btnData) {
				var btn = document.createElement('button');
				btn.className = 'btn';
				btn.innerText = btnData.label;
				btn.style.color = btnData.textcolor || '#000000';
				btn.style.backgroundColor = btnData.fillcolor || '#007bff';
				btn.onclick = function () {
					connection.send("INPUT:" + btnData.input);
				};
				buttonContainer.appendChild(btn);
			});

			document.getElementById('status').innerHTML = "Ready";
			document.getElementById('status').style.backgroundColor = "transparent";
		}

		async function fallback() {
			console.log("fallback");
			const response = await fetch("/12/website/config.json");
			const config = await response.json();
			buildPage(config);

		}
	</script>
</head>

<body onload="init()">
	<div class="container">
		<img id="main-image" src="/10/images/startup.bmp">
		<div id="button-container"></div>
		<div id="status">Waiting for Fizz Bizz Client...</div>
	</div>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
	<meta charset='UTF-8'>
	<meta name='viewport' content='width=device-width, initial-scale=1.0'>
	<title>Dynamic Dashboard</title>
	<style>
		body {
			text-align: center;
			font-family: sans-serif;
			background: #f4f6f9;
			color: #333;
			margin: 0;
			padding: 20px;
		}

		.container {
			max-width: 500px;
			margin: 0 auto;
			background: white;
			padding: 20px;
			border-radius: 10px;
			box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
		}

		#main-image {
			max-width: 100%;
			height: auto;
			border-radius: 5px;
			margin-bottom: 15px;
		}

		.btn {
			padding: 15px;
			font-size: 16px;
			margin: 10px 0;
			width: 100%;
			border: none;
			color: white;
			cursor: pointer;
			border-radius: 5px;
			font-weight: bold;
			transition: opacity 0.2s;
		}

		.btn:hover {
			opacity: 0.9;
		}

		#status {
			font-weight: bold;
			margin-top: 20px;
			font-size: 18px;
			color: #666;
			padding: 10px;
			border-radius: 5px;
		}
	</style>
	<script>
		var connection = new WebSocket('ws://' + location.hostname + ':81/');
		connection.onopen = function () { document.getElementById('status').innerHTML = "connected. loading configuration..."; };
		connection.onerror = function (error) { document.getElementById('status').innerHTML = "cannot connect to websocket"; };
		connection.onmessage = function (e) {
			var rawData = e.data;
			if (rawData.startsWith("CONFIG:")) {
				var config = JSON.parse(rawData.substring(7));
				buildPage(config);
				return;
			}
		};

		function buildPage(config) {
			if (config.title) document.getElementById('main-title').innerText = config.title;
			
			if (config.image) {
				var img = document.getElementById('main-image');
				img.src = config.image;
				img.style.display = "block";
			}

			var buttonContainer = document.getElementById('button-container');
			buttonContainer.innerHTML = "";
			config.buttons.forEach(function (btnData) {
				var btn = document.createElement('button');
				btn.className = 'btn';
				btn.innerText = btnData.label;
				btn.style.backgroundColor = btnData.color || '#007bff';
				btn.onclick = function () { connection.send("INPUT:" + btnData.input); };
				buttonContainer.appendChild(btn);
			});

			document.getElementById('status').innerHTML = "Ready";
			document.getElementById('status').style.backgroundColor = "transparent";
		}
	</script>
</head>

<body>
	<div class="container">
		<h1 id="main-title">Fizz Bizz Dashboard</h1>
		<img id="main-image" src="/10/bitmaps/startup.bmp">
		<div id="button-container"></div>
		<div id="status">Waiting for Fizz Bizz Client...</div>
	</div>
</body>

</html>

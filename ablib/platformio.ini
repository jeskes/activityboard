[platformio]
src_dir = ./examples/sandbox

[env]
framework = arduino
lib_extra_dirs = .
lib_ldf_mode = deep+

[env:esp32dev]
platform = espressif32
board = esp32dev
lib_deps =
	arkhipenko/TaskScheduler@^4.0.8
	robtillaart/I2CKeyPad@^0.5.2
	bblanchon/ArduinoJson@^7.2.2
	madhephaestus/ESP32Encoder@^5.0.0

[env:arduino]
platform = atmelmegaavr
board = nano_every
lib_deps =
	arkhipenko/TaskScheduler@^4.0.8
	robtillaart/I2CKeyPad@^0.5.2
	bblanchon/ArduinoJson@^7.2.2

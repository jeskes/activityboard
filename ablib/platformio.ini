[platformio]
src_dir = ./examples/sandbox
default_envs = arduino

[env]
framework = arduino
lib_extra_dirs = .
lib_ldf_mode = deep+

[env:arduino]
platform = atmelmegaavr
board = nano_every

build_flags =
	-D AB_DEBUG
	-D AB_INIPARSER
	-D AB_NUMPAD
	-D AB_ROTARYENCODER
	-D AB_STORAGE
	-D AB_MAINTENANCE
	-D AB_UARTCONTROLLER
	-D AB_NFCCONTROLLER

lib_deps = 
	arkhipenko/TaskScheduler@^4.0.8
	robtillaart/PCF8574@^0.4.6
	robtillaart/I2CKeyPad@^0.5.2
	robtillaart/rotaryDecoderSwitch@^0.4.3
	links2004/WebSockets@^2.7.3
	miguelbalboa/MFRC522@^1.4.12
	
[env:esp32dev]
platform = espressif32
board = esp32dev

build_flags =
	-D AB_DEBUG
	-D AB_INIPARSER
	-D AB_NUMPAD
	-D AB_ROTARYENCODER
	-D AB_STORAGE
	-D AB_MAINTENANCE
	-D AB_UARTCONTROLLER
	-D AB_NFCCONTROLLER

lib_deps = 
	arkhipenko/TaskScheduler@^4.0.8
	robtillaart/PCF8574@^0.4.6
	robtillaart/I2CKeyPad@^0.5.2
	robtillaart/rotaryDecoderSwitch@^0.4.3
	bblanchon/ArduinoJson@^7.2.2
	lovyan03/LovyanGFX@^1.2.0
	adafruit/Adafruit NeoPixel@^1.15.5
	links2004/WebSockets@^2.7.3
	xreef/SimpleFTPServer@^3.0.1
	miguelbalboa/MFRC522@^1.4.12

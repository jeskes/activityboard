[platformio]
default_envs = release

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_ldf_mode = deep+
lib_archive = yes
lib_deps = 
	symlink://../ablib
	arkhipenko/TaskScheduler@^4.0.8
	robtillaart/I2CKeyPad@^0.5.2
	robtillaart/PCF8574@^0.4.6
	miguelbalboa/MFRC522@^1.4.12

build_unflags = 
	-std=gnu++11

upload_port = COM10
upload_speed = 115200

monitor_port = COM10
monitor_speed = 115200

[env:debug]
build_flags = 
	-std=gnu++17
	-D DEBUG
	-D CORE_DEBUG_LEVEL=3

[env:release]
build_flags = 
	-std=gnu++17
	-D RELEASE

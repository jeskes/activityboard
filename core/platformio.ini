[platformio]
default_envs = core-ota

[env]
platform = platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
; board_build.partitions = huge_app.csv
board_build.partitions = min_spiffs.csv

lib_deps = 
	symlink://../ablib
	arkhipenko/TaskScheduler@^4.0.8
	robtillaart/PCF8574@^0.4.6
	robtillaart/I2CKeyPad@^0.5.2
	robtillaart/rotaryDecoderSwitch@^0.4.3
	bblanchon/ArduinoJson@^7.2.2
	lovyan03/LovyanGFX@^1.2.0
	adafruit/Adafruit NeoPixel@^1.15.5
	links2004/WebSockets@^2.7.3
	xreef/SimpleFTPServer@^3.0.1

build_unflags = -std=gnu++11

upload_port = COM13
;upload_resetmethod = nodemcu
;upload_flags = 
;	--before=default_reset
;	--after=hard_reset

;upload_protocol = espota
;upload_port = 10.0.0.1

monitor_port = COM13
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:core-debug]
build_flags = 
	-std=gnu++17
	-D _TASK_HEADER_AND_CPP
	-D _TASK_STD_FUNCTION
	-D AB_DEBUG
	-D AB_STORAGE
	-D AB_MAINTENANCE
	-D AB_UARTCONTROLLER

[env:core-release]
build_flags = 
	-std=gnu++17
	-D RELEASE
	-D _TASK_HEADER_AND_CPP
	-D _TASK_STD_FUNCTION
	-D AB_STORAGE
	-D AB_MAINTENANCE
	-D AB_UARTCONTROLLER

[env:core-ota]
extends = env:core-debug
upload_protocol = espota
upload_port = 192.168.188.102
;core.local
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = release

[env]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
lib_deps = 
	symlink://../ablib
	arkhipenko/TaskScheduler@^4.0.8
	dfrobot/DFRobotDFPlayerMini@^1.0.6
	robtillaart/I2CKeyPad@^0.5.2
	bblanchon/ArduinoJson@^7.2.2
	adafruit/Adafruit ILI9341 @ ^1.6.4
	adafruit/Adafruit GFX Library @ ^1.12.6
	madhephaestus/ESP32Encoder@^5.0.0
	adafruit/Adafruit NeoPixel@^1.15.5
	esphome/ESP32-audioI2S@^2.3.0
build_unflags = -std=gnu++11
upload_port = COM13
upload_resetmethod = nodemcu
upload_flags = 
	--before=default_reset
	--after=hard_reset
monitor_port = COM13
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:debug]
build_flags = 
	-D DEBUG
	-D CORE_DEBUG_LEVEL=3
	-std=gnu++17

[env:release]
build_flags = -D RELEASE -std=gnu++17

[platformio]
default_envs = release

[env]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps = 
	symlink://../ablib
	arkhipenko/TaskScheduler@^4.0.8
	dfrobot/DFRobotDFPlayerMini@^1.0.6
	robtillaart/PCF8574@^0.4.6
	robtillaart/I2CKeyPad@^0.5.2
	robtillaart/rotaryDecoderSwitch@^0.4.3
	bblanchon/ArduinoJson@^7.2.2
	adafruit/Adafruit ILI9341 @ ^1.6.4
	adafruit/Adafruit GFX Library @ ^1.12.6
	adafruit/Adafruit NeoPixel@^1.15.5
	links2004/WebSockets@^2.7.3

build_unflags = -std=gnu++11

upload_port = COM13
upload_resetmethod = nodemcu
upload_flags = 
	--before=default_reset
	--after=hard_reset

monitor_port = COM13
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:debug]
build_flags = 
	-std=gnu++17
	-D DEBUG
	-D CORE_DEBUG_LEVEL=3
	-D _TASK_HEADER_AND_CPP
	-D _TASK_STD_FUNCTION

[env:release]
build_flags = 
	-std=gnu++17
	-D RELEASE
	-D _TASK_HEADER_AND_CPP
	-D _TASK_STD_FUNCTION

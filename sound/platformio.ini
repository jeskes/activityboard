[platformio]
default_envs = sound-ota

[env]
;platform = espressif32
;platform = https://github.com/platformio/platform-espressif32.git
platform = https://github.com/platformio/platform-espressif32.git#7afb0a703a5f6492fd695a4c2ced9ad843745280
board = esp32-c3-devkitm-1
framework = arduino
; board_build.partitions = huge_app.csv
board_build.partitions = min_spiffs.csv

lib_deps = 
    symlink://../ablib
	earlephilhower/ESP8266Audio @ 2.4.3

build_unflags = -std=gnu++11
	
upload_port = COM12
upload_speed = 115200
monitor_port = COM12
monitor_speed = 115200

[env:sound-debug]
build_flags = 
	-std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
	-D AB_DEBUG
	-D AB_UARTCONTROLLER

[env:sound-release]
build_flags = 
	-std=gnu++17
	-D RELEASE
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
	-D AB_UARTCONTROLLER

[env:sound-ota]
extends = env:sound-debug
upload_protocol = espota
upload_port = 192.168.188.101
;sound.local
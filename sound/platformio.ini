[platformio]
default_envs = release

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino

lib_deps = 
	symlink://../ablib
	arkhipenko/TaskScheduler@^4.0.8
	dfrobot/DFRobotDFPlayerMini@^1.0.6
	paulstoffregen/Encoder@^1.4.4
	robtillaart/I2CKeyPad@^0.5.2

upload_port = COM12
upload_speed = 115200

monitor_port = COM12
monitor_speed = 115200

[env:debug]
build_flags = 
	-D DEBUG 
	-D CORE_DEBUG_LEVEL=3

[env:release]
build_flags = -D RELEASE

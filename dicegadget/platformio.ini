[platformio]
default_envs = release

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino

lib_ldf_mode = deep+
lib_archive = yes
lib_deps = 
	symlink://../ablib
	arkhipenko/TaskScheduler@^4.0.8
	robtillaart/I2CKeyPad@^0.5.2

upload_port = COM11
upload_speed = 115200

monitor_port = COM11
monitor_speed = 115200
; monitor_dtr = 0
; monitor_rts = 0

[env:debug]
; build_type = debug
build_flags = 
	-D DEBUG 
	-D CORE_DEBUG_LEVEL=3

[env:release]
build_flags = -D RELEASE
